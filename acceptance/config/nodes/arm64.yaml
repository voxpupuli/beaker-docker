---
HOSTS:
  debian12-arm64:
    platform: debian-12-aarch64
    hypervisor: docker
    image: docker.io/library/debian:12
    docker_platform: linux/arm64
    roles:
      - master
      - agent
      - dashboard
      - database
      - classifier
      - default
CONFIG:
  # These architecture checks use the default SSH environment. The guest runs without systemd.
  set_env: false
  nfs_server: none
  consoleport: 443
  log_level: verbose
  dockeropts:
    HostConfig:
      Privileged: true
  type: aio
  ssh:
    verify_host_key: false
    user_known_hosts_file: '/dev/null'
    password: root
    auth_methods:
      - password
